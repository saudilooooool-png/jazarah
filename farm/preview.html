<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>مزرعة جزّور — عالم ثلاثي الأبعاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2b1c;
      --cream: #fffaf0;
      --leaf: #4f8f36;
      --leaf-dark: #31722e;
      --path: #d99543;
      --shadow: rgba(38, 68, 25, .28);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d9d3c6; }
    body { display: grid; place-items: center; font-family: Cairo, system-ui, sans-serif; color: var(--ink); user-select: none; }
    button { font: inherit; }

    .phone {
      position: relative;
      width: min(430px, 100vw);
      height: min(860px, 100vh);
      height: min(860px, 100dvh);   /* سفاري يخفي شريطه فيتغير الارتفاع — dvh يتبعه */
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(#9eddf0 0 15%, #77c461 16% 100%);
      border-radius: min(32px, 4vw);
      box-shadow: 0 22px 50px rgba(52, 41, 24, .25);
      touch-action: none;
    }

    .world-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
    .world-viewport.is-dragging { cursor: grabbing; }
    .world {
      position: absolute;
      width: 1180px;
      height: 664px;
      top: 102px;
      left: -375px;
      transform: translate3d(0, 0, 0);
      transform-origin: 0 0;
      will-change: transform;
    }
    .world-base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

    .world-object { position: absolute; transform-origin: 50% 100%; border: 0; padding: 0; background: transparent; filter: drop-shadow(0 9px 7px var(--shadow)); cursor: pointer; }
    .world-object img { width: 100%; display: block; pointer-events: none; }
    .home { z-index: 283; width: 192px; left: 498px; top: 110px; animation: homeBreathe 4.6s ease-in-out infinite; }
    .barn { z-index: 321; width: 184px; left: 197px; top: 193px; animation: barnSway 5.8s ease-in-out infinite; }
    .egg { width: 78px; left: 640px; top: 392px; animation: eggWarm 2.6s ease-in-out infinite; }
    .egg[hidden] { display: none; }
    .ground-shadow { position: absolute; border-radius: 50%; background: rgba(34, 77, 27, .24); filter: blur(5px); pointer-events: none; }
    .home-shadow { width: 124px; height: 24px; left: 531px; top: 283px; }
    .barn-shadow { width: 112px; height: 22px; left: 233px; top: 321px; }
    .egg-shadow { width: 49px; height: 11px; left: 655px; top: 464px; }

    @keyframes homeBreathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes barnSway { 0%, 100% { transform: rotate(-.7deg); } 50% { transform: rotate(.7deg); } }
    @keyframes eggWarm { 0%, 100% { transform: translateY(0) rotate(0deg); } 42% { transform: translateY(-4px) rotate(-3deg); } 62% { transform: translateY(-1px) rotate(2deg); } }

    .farm-spot {
      position: absolute;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
    }
    .farm-spot:focus-visible, .world-object:focus-visible { outline: 3px solid #fff; outline-offset: 5px; border-radius: 18px; }
    .well-spot { left: 864px; top: 163px; width: 112px; height: 116px; border-radius: 50%; }
    .field-spot { left: 238px; top: 370px; width: 224px; height: 180px; border-radius: 34%; }
    .site-spot { left: 610px; top: 397px; width: 158px; height: 108px; border-radius: 40%; }

    .site-pin {
      position: absolute;
      right: 6px;
      bottom: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px 7px 8px;
      background: #fffaf1;
      color: #4e341d;
      border: 2px solid #c98a3d;
      border-radius: 17px;
      box-shadow: 0 4px 0 rgba(116, 72, 29, .18), 0 7px 14px rgba(72, 55, 28, .2);
      white-space: nowrap;
      font: 900 12px Cairo, sans-serif;
      animation: invite 2.3s ease-in-out infinite;
    }
    .site-pin::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #6ab14d; box-shadow: inset 0 -2px 0 rgba(33, 94, 34, .25); }
    @keyframes invite { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.025); } }

    .jazour {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      left: 566px;
      top: 282px;
      width: 94px;
      z-index: 392;
      cursor: pointer;
      transition: transform 1.25s cubic-bezier(.34, 1.1, .64, 1);
      filter: drop-shadow(0 10px 7px rgba(35, 72, 25, .3));
    }
    .jazour img { width: 100%; display: block; animation: jazourHop 1.1s ease-in-out infinite; }
    .jazour .character-shadow { position: absolute; width: 51px; height: 12px; right: 21px; bottom: 5px; border-radius: 50%; background: rgba(36, 78, 28, .27); filter: blur(3px); z-index: -1; }
    @keyframes jazourHop { 0%, 100% { transform: translateY(0) scaleY(1); } 48% { transform: translateY(-5px) scaleY(1.025); } 70% { transform: translateY(0) scaleY(.975); } }
    .speech {
      position: absolute;
      bottom: 83%;
      right: 42%;
      width: max-content;
      max-width: min(168px, 42vw);
      padding: 8px 11px;
      background: #fffdf6;
      border-radius: 14px;
      color: #3c2a18;
      text-align: center;
      font: 800 12px Cairo, sans-serif;
      line-height: 1.65;
      box-shadow: 0 5px 15px rgba(49, 60, 33, .22);
      transform: scale(.6);
      opacity: 0;
      transition: opacity .2s, transform .25s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
    }
    .speech::after { content: ''; position: absolute; right: 22px; top: calc(100% - 1px); border: 7px solid transparent; border-top-color: #fffdf6; }
    .speech.on { transform: scale(1); opacity: 1; }

    .top-ui {
      position: absolute;
      inset: 0 0 auto;
      z-index: 30;
      padding: 11px 11px 34px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(247, 252, 243, .95), rgba(247, 252, 243, 0));
    }
    .brand { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 14px; background: rgba(255, 252, 244, .82); color: #5a482c; font: 900 11px Cairo, sans-serif; box-shadow: 0 3px 9px rgba(39, 73, 27, .11); }
    .brand-dot { width: 8px; height: 8px; background: #74b84d; border-radius: 50%; box-shadow: 0 0 0 3px rgba(116, 184, 77, .18); }
    .resources { display: flex; gap: 5px; margin-top: 8px; direction: rtl; }
    .resource {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      padding: 5px 3px;
      border-radius: 999px;
      background: rgba(255, 249, 235, .96);
      color: #46351f;
      box-shadow: 0 2px 0 rgba(147, 112, 67, .16);
      font: 900 12px Cairo, sans-serif;
    }
    .resource img { width: 17px; height: 17px; object-fit: contain; }
    .resource.bump { animation: resourceBump .48s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes resourceBump { 50% { transform: scale(1.18); background: #fff; } }

    .objective {
      position: absolute;
      right: 12px;
      left: 12px;
      bottom: calc(15px + env(safe-area-inset-bottom));
      z-index: 35;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      background: rgba(255, 253, 245, .97);
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 19px;
      box-shadow: 0 8px 22px rgba(53, 71, 34, .23);
      direction: rtl;
    }
    .objective-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(145deg, #ffce6d, #e89543); box-shadow: inset 0 2px 0 rgba(255,255,255,.45); }
    .objective-icon img { width: 29px; height: 29px; object-fit: contain; }
    .objective-kicker { color: #6e9b49; font: 900 10px Cairo, sans-serif; line-height: 1.2; }
    .objective-title { margin-top: 1px; color: #3a2919; font: 900 13px Cairo, sans-serif; line-height: 1.35; }
    .objective-copy { display: block; margin-top: 1px; color: #806d55; font: 700 10px Cairo, sans-serif; }
    .focus-button {
      border: 0;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--leaf);
      color: #fff;
      font: 900 11px Cairo, sans-serif;
      box-shadow: 0 3px 0 var(--leaf-dark);
      cursor: pointer;
    }
    .focus-button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--leaf-dark); }

    .build-sheet {
      position: absolute;
      z-index: 50;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 15px 15px 20px;
      background: #fffdf7;
      border-radius: 25px 25px 0 0;
      box-shadow: 0 -10px 28px rgba(41, 49, 26, .28);
      /* تُمرَّر بالإصبع، ولا تختفي خياراتها تحت شريط المتصفح */
      max-height: 76%;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateY(108%);
      transition: transform .35s cubic-bezier(.34, 1.25, .64, 1);
    }
    .build-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 4px; margin: 0 auto 11px; border-radius: 9px; background: #e7dcc8; }
    .sheet-header { display: flex; align-items: center; gap: 10px; }
    .sheet-header img { width: 61px; height: 61px; object-fit: contain; filter: drop-shadow(0 4px 4px rgba(47,70,28,.18)); }
    .sheet-title { margin: 0; color: #342516; font: 900 17px Cairo, sans-serif; }
    .sheet-copy { margin: 1px 0 0; color: #7c684f; font: 700 11px Cairo, sans-serif; }
    .cost-row { display: flex; gap: 7px; margin: 13px 0; direction: rtl; }
    .cost { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; padding: 7px 5px; border-radius: 11px; background: #f7f0df; color: #5d4830; font: 900 11px Cairo, sans-serif; }
    .cost img { width: 18px; height: 18px; object-fit: contain; }
    .sheet-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .build-button { border: 0; border-radius: 13px; padding: 10px; background: linear-gradient(180deg, #6db74e, #4e963a); color: #fff; box-shadow: 0 3px 0 #34762e; font: 900 13px Cairo, sans-serif; cursor: pointer; }
    .cancel-button { border: 0; border-radius: 13px; padding: 10px 13px; background: #f3eee4; color: #7b6750; font: 800 12px Cairo, sans-serif; cursor: pointer; }
    .build-button:active, .cancel-button:active { transform: translateY(2px); }

    .toast {
      position: absolute;
      z-index: 60;
      top: 118px;
      right: 50%;
      width: max-content;
      max-width: calc(100% - 42px);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(57, 99, 42, .95);
      color: #fff;
      font: 800 12px Cairo, sans-serif;
      transform: translate(50%, -14px) scale(.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .25s cubic-bezier(.34, 1.56, .64, 1);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(50%, 0) scale(1); }
    .walk-tip { position: absolute; z-index: 22; left: 50%; top: 105px; transform: translateX(-50%); padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.84); color: #65533a; font: 800 10.5px Cairo, sans-serif; white-space: nowrap; box-shadow: 0 3px 10px rgba(46,73,31,.14); transition: opacity .4s; pointer-events: none; }
    .walk-tip.hide { opacity: 0; }

    @media (max-height: 690px) {
      .phone { border-radius: 0; }
      .world { top: 65px; }
      .objective { bottom: 8px; }
      .walk-tip { top: 98px; }
    }

    /* ── مواقع البناء: علامة ＋ واضحة على الأرض ── */
    .slot {
      position: absolute;
      display: grid;
      place-items: center;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .slot-ring {
      position: absolute;
      inset: 0;
      border: 3px dashed rgba(255, 255, 255, .85);
      border-radius: 50%;
      background: rgba(126, 190, 88, .3);
      box-shadow: inset 0 0 22px rgba(255, 255, 255, .35);
    }
    .slot-plus {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fffdf5;
      color: #4f9138;
      font: 900 30px Cairo, sans-serif;
      line-height: 1;
      border: 3px solid #6fb84e;
      box-shadow: 0 5px 0 rgba(52, 118, 46, .5), 0 9px 16px rgba(40, 70, 25, .28);
      animation: slotBeat 2s ease-in-out infinite;
    }
    @keyframes slotBeat {
      0%, 72%, 100% { transform: translateY(0) scale(1); }
      80% { transform: translateY(-6px) scale(1.1); }
      90% { transform: translateY(0) scale(.97); }
    }
    .slot:active .slot-plus { transform: scale(.92); }
    .slot.hint .slot-ring { animation: slotHint 1s ease-in-out 3; }
    @keyframes slotHint { 50% { background: rgba(255, 235, 130, .7); border-color: #fff; } }
    .slot[hidden] { display: none; }

    .scaffold { position: absolute; filter: drop-shadow(0 8px 6px var(--shadow)); pointer-events: none; }
    .scaffold img { width: 100%; display: block; }
    .placed { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; filter: drop-shadow(0 9px 7px var(--shadow)); transform-origin: 50% 92%; }
    .placed img { width: 100%; display: block; pointer-events: none; }
    .placed.grow { animation: placeGrow .55s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes placeGrow { 0% { transform: scale(.55); } 62% { transform: scale(1.09); } 100% { transform: scale(1); } }
    .dust { position: absolute; width: 15px; height: 15px; border-radius: 50%; background: rgba(214, 189, 152, .92); pointer-events: none; z-index: 9000; }
    /* رقعة أرض مهيّأة تحت كل مبنى جديد — بدونها يبدو ملصوقًا على العشب */
    .pad { position: absolute; border-radius: 50%; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, rgba(190,153,102,.72) 0%, rgba(174,137,88,.55) 58%, rgba(178,140,90,0) 100%); }

    /* ── لوحة الاختيار ── */
    .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .pick {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 2px solid #ece1cb;
      border-radius: 16px;
      background: #f9f4e8;
      text-align: right;
      cursor: pointer;
      transition: transform .12s;
    }
    .pick:active { transform: scale(.96); }
    .pick.locked { opacity: .45; }
    .pick > img { width: 46px; height: 46px; object-fit: contain; flex: none; }
    .pick-name { color: #3a2919; font: 900 12.5px Cairo, sans-serif; }
    .pick-cost { display: flex; gap: 7px; margin-top: 3px; }
    .pick-cost span { display: flex; align-items: center; gap: 3px; color: #7d6950; font: 800 10.5px Cairo, sans-serif; }
    .pick-cost img { width: 14px; height: 14px; object-fit: contain; }
  </style>
</head>
<body>
  <main class="phone" aria-label="مزرعة جزّور">
    <div class="world-viewport" id="viewport" aria-label="عالم المزرعة القابل للتجول">
      <section class="world" id="world" aria-label="عالم مزرعة جزّور">
        <img class="world-base" src="land/world_farm_3d.webp" alt="أرض مزرعة ثلاثية الأبعاد فيها طريق وحقل وبئر ومواقع بناء">

        <span class="ground-shadow home-shadow"></span>
        <button class="world-object home" id="home" type="button" aria-label="بيت جزّور">
          <img src="buildings/home_exact.webp?v=2" alt="بيت جزّور">
        </button>

        <span class="ground-shadow barn-shadow"></span>
        <button class="world-object barn" id="barn" type="button" aria-label="حظيرة الرفيق">
          <img src="buildings/barn_exact.webp?v=2" alt="حظيرة الرفيق">
        </button>

        <button class="farm-spot well-spot" id="well" type="button" aria-label="بئر المزرعة"></button>
        <button class="farm-spot field-spot" id="field" type="button" aria-label="حقل الجزر"></button>

        <div id="slots"></div>

        <button class="jazour" id="jazour" type="button" aria-label="تحدث مع جزّور">
          <span class="character-shadow"></span>
          <span class="speech" id="speech" aria-live="polite"></span>
          <img id="jazourImage" src="characters/jazour/hero.webp?v=2" alt="جزّور">
        </button>
      </section>
    </div>

    <div class="top-ui">
      <div class="brand"><span class="brand-dot"></span>مزرعة جزّور</div>
      <div class="resources" aria-label="موارد المزرعة">
        <div class="resource" data-resource="wood"><span>١٤</span><img src="resources/wood.webp" alt="خشب"></div>
        <div class="resource" data-resource="stone"><span>١٠</span><img src="resources/stone.webp" alt="حجر"></div>
        <div class="resource" data-resource="water"><span>٨</span><img src="resources/water.webp" alt="ماء"></div>
        <div class="resource" data-resource="light"><span>٥</span><img src="resources/light.webp" alt="نور"></div>
        <div class="resource" data-resource="seed"><span>١٢</span><img src="resources/seed.webp" alt="بذور"></div>
      </div>
    </div>

    <p class="walk-tip" id="walkTip">اسحب لتتجول · اضغط ＋ لتبني</p>
    <div class="toast" id="toast" role="status"></div>

    <section class="objective" aria-label="الخطوة التالية">
      <div class="objective-icon"><img id="objectiveIcon" src="resources/wood.webp" alt=""></div>
      <div>
        <div class="objective-kicker">خطوتنا التالية</div>
        <div class="objective-title" id="objectiveTitle">ابنِ أول شيء في مزرعتك</div>
        <span class="objective-copy" id="objectiveCopy">اضغط علامة ＋ الخضراء على الأرض.</span>
      </div>
      <button class="focus-button" id="focusButton" type="button">وين؟</button>
    </section>

    <section class="build-sheet" id="buildSheet" aria-labelledby="sheetTitle" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <h2 class="sheet-title" id="sheetTitle">وش نبني هنا؟</h2>
          <p class="sheet-copy">اختر، وجزّور يبنيه لك حالًا.</p>
        </div>
      </div>
      <div class="pick-grid" id="pickGrid"></div>
      <div class="sheet-actions" style="grid-template-columns: 1fr; margin-top: 12px">
        <button class="cancel-button" id="cancelButton" type="button">ليس الآن</button>
      </div>
    </section>
  </main>

  <script>
    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const slotsLayer = document.getElementById('slots');
    const walkTip = document.getElementById('walkTip');
    const speech = document.getElementById('speech');
    const jazour = document.getElementById('jazour');
    const jazourImage = document.getElementById('jazourImage');
    const sheet = document.getElementById('buildSheet');
    const pickGrid = document.getElementById('pickGrid');
    const toast = document.getElementById('toast');
    const objectiveIcon = document.getElementById('objectiveIcon');
    const objectiveTitle = document.getElementById('objectiveTitle');
    const objectiveCopy = document.getElementById('objectiveCopy');
    const focusButton = document.getElementById('focusButton');

    /* ═══ ما يمكن بناؤه ═══ */
    const CATALOG = [
      { id: 'egg',   name: 'عش الرفيق', img: 'companions/egg_brown.webp', w: 86,
        cost: { light: 4, seed: 5 }, line: 'يا سلام! صار للرفيق بيت دافئ!' },
      { id: 'field', name: 'حقل جزر',   img: 'buildings/field.webp',      w: 172,
        cost: { seed: 4, water: 3 },  line: 'حقل جديد! بنزرعه سوا.' },
      { id: 'well',  name: 'بئر ماء',   img: 'buildings/well.webp',       w: 118, pad: true,
        cost: { stone: 6, wood: 2 },  line: 'موية أكثر يعني جزر أكبر!' },
      { id: 'barn',  name: 'حظيرة',     img: 'buildings/barn.webp',       w: 152, pad: true,
        cost: { wood: 8, stone: 3 },  line: 'الحظيرة جاهزة تستقبل الرفاق.' },
    ];
    const ICONS = {
      wood: 'resources/wood.webp', stone: 'resources/stone.webp',
      water: 'resources/water.webp', light: 'resources/light.webp', seed: 'resources/seed.webp',
    };

    /* مواقع البناء على الأرض المرسومة (إحداثيات داخل عالم 1180×664) */
    /* اختيرت على العشب المفتوح فقط: لا فوق ممر، ولا فوق بناء مرسوم أصلًا */
    const SLOTS = [
      { x: 678, y: 424, r: 58 },
      { x: 878, y: 422, r: 60 },
      { x: 970, y: 492, r: 56 },
      { x: 884, y: 556, r: 58 },
    ];

    const RES = { wood: 14, stone: 10, water: 8, light: 5, seed: 12 };
    const arabicDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

    const pan = { x: 0, y: 0, minX: 0, maxX: 0, minY: 0, maxY: 0 };
    let drag = null;
    let moved = 0;
    let openSlot = null;
    let speechTimer;
    let toastTimer;

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

    let worldScale = 1;
    function paintWorld() {
      world.style.transform = `translate3d(${pan.x}px, ${pan.y}px, 0) scale(${worldScale})`;
    }

    /* حدود الكاميرا تُحسب من المقاسات الحقيقية لا بأرقام ثابتة، حتى لا تنكشف
       أرضية فارغة تحت الرسمة على الشاشات الطويلة. */
    function fitWorld() {
      const vp = viewport.getBoundingClientRect();
      const card = document.querySelector('.objective');
      const bandBottom = card ? card.getBoundingClientRect().top - vp.top : vp.height;
      const left = world.offsetLeft, top = world.offsetTop;
      const W = world.offsetWidth, H = world.offsetHeight;

      worldScale = Math.max(1, vp.width / W, (bandBottom - top) / H);
      const w = W * worldScale, h = H * worldScale;

      pan.maxX = -left;
      pan.minX = vp.width - (left + w);
      pan.maxY = 0;
      pan.minY = bandBottom - (top + h);
      if (pan.minX > pan.maxX) pan.minX = pan.maxX = (vp.width - w) / 2 - left;
      if (pan.minY > pan.maxY) pan.minY = pan.maxY = 0;

      pan.x = clamp(pan.x, pan.minX, pan.maxX);
      pan.y = clamp(pan.y, pan.minY, pan.maxY);
      paintWorld();
    }

    /* ═══ الموارد ═══ */
    function paintResources() {
      for (const [key, value] of Object.entries(RES)) {
        const span = document.querySelector(`[data-resource="${key}"] span`);
        if (span) span.textContent = arabicDigits(value);
      }
    }
    const canAfford = cost => Object.entries(cost).every(([k, n]) => RES[k] >= n);
    function bump(resource) {
      const el = document.querySelector(`[data-resource="${resource}"]`);
      if (!el) return;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
    function spend(cost) {
      for (const [k, n] of Object.entries(cost)) { RES[k] -= n; bump(k); }
      paintResources();
    }
    paintResources();

    /* ═══ كلام جزّور ═══ */
    function say(text, pose = 'hero.webp') {
      speech.textContent = text;
      speech.classList.add('on');
      jazourImage.src = `characters/jazour/${pose}?v=2`;
      clearTimeout(speechTimer);
      speechTimer = setTimeout(() => {
        speech.classList.remove('on');
        jazourImage.src = 'characters/jazour/hero.webp?v=2';
      }, 2600);
    }
    function notify(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
    }

    /* ═══ علامات ＋ على الأرض ═══ */
    function drawSlots() {
      slotsLayer.innerHTML = SLOTS.map((s, i) => `
        <button class="slot" type="button" data-slot="${i}" aria-label="ابنِ هنا"
          style="left:${s.x - s.r}px;top:${s.y - s.r * 0.62}px;width:${s.r * 2}px;height:${s.r * 1.24}px;z-index:${Math.round(s.y)}">
          <span class="slot-ring"></span><span class="slot-plus">＋</span>
        </button>`).join('');
      slotsLayer.querySelectorAll('.slot').forEach(el => {
        el.style.animationDelay = (Number(el.dataset.slot) * 0.35) + 's';
        el.addEventListener('click', () => {
          if (moved > 12) return;
          openBuild(Number(el.dataset.slot));
        });
      });
    }

    function freeSlots() {
      return [...slotsLayer.querySelectorAll('.slot')].filter(el => !el.hidden);
    }

    function refreshObjective() {
      const left = freeSlots().length;
      if (left) {
        objectiveTitle.textContent = 'ابنِ في مزرعتك';
        objectiveCopy.textContent = `باقي ${arabicDigits(left)} مواقع فيها علامة ＋ — اضغط أي واحدة.`;
        focusButton.textContent = 'وين؟';
        focusButton.hidden = false;
      } else {
        objectiveIcon.src = 'companions/egg_brown.webp';
        objectiveTitle.textContent = 'مزرعتك اكتملت!';
        objectiveCopy.textContent = 'أنجز مهام جديدة لتفتح أرضًا أوسع.';
        focusButton.hidden = true;
      }
    }

    /* الكاميرا تروح لأقرب موقع فارغ وتومض عليه — جواب سؤال «وين أبني؟» */
    function showNextSlot() {
      const el = freeSlots()[0];
      if (!el) { say('كل المواقع صارت مبنية! ما شاء الله.', 'proud.webp'); return; }
      const i = Number(el.dataset.slot), s = SLOTS[i];
      const vp = viewport.getBoundingClientRect();
      pan.x = clamp(vp.width / 2 - (world.offsetLeft + s.x * worldScale), pan.minX, pan.maxX);
      pan.y = clamp(vp.height * 0.45 - (world.offsetTop + s.y * worldScale), pan.minY, pan.maxY);
      paintWorld();
      walkTip.classList.add('hide');
      el.classList.remove('hint');
      void el.offsetWidth;
      el.classList.add('hint');
      say('هنا! اضغط ＋ واختر.', 'thinking.webp');
    }

    /* ═══ لوحة الاختيار ═══ */
    function openBuild(index) {
      openSlot = index;
      pickGrid.innerHTML = CATALOG.map(item => {
        const ok = canAfford(item.cost);
        const cost = Object.entries(item.cost)
          .map(([k, n]) => `<span><img src="${ICONS[k]}" alt="">${arabicDigits(n)}</span>`).join('');
        return `<button class="pick ${ok ? '' : 'locked'}" type="button" data-pick="${item.id}">
            <img src="${item.img}" alt="">
            <span><span class="pick-name">${item.name}</span>
            <span class="pick-cost">${cost}</span></span>
          </button>`;
      }).join('');
      pickGrid.querySelectorAll('.pick').forEach(el => el.addEventListener('click', () => {
        const item = CATALOG.find(c => c.id === el.dataset.pick);
        if (!canAfford(item.cost)) {
          say('ناقصنا شوي موارد… أنجز مهمة وارجع!', 'thinking.webp');
          notify('الموارد ما تكفي بعد');
          return;
        }
        build(openSlot, item);
        closeBuild();
      }));
      sheet.classList.add('open');
      sheet.setAttribute('aria-hidden', 'false');
    }
    function closeBuild() {
      sheet.classList.remove('open');
      sheet.setAttribute('aria-hidden', 'true');
    }

    /* ═══ لحظة البناء ═══ */
    function build(index, item) {
      const s = SLOTS[index];
      const slotEl = slotsLayer.querySelector(`[data-slot="${index}"]`);
      spend(item.cost);
      slotEl.hidden = true;
      walkTip.classList.add('hide');
      refreshObjective();

      const scaffold = document.createElement('div');
      scaffold.className = 'scaffold';
      scaffold.style.cssText = `left:${s.x - 66}px;top:${s.y - 118}px;width:132px;z-index:${Math.round(s.y)}`;
      scaffold.innerHTML = '<img src="buildings/scaffold.webp" alt="">';
      world.appendChild(scaffold);
      say('نبنيه الحين…', 'encourage.webp');
      notify('بدأ البناء…');

      setTimeout(() => {
        scaffold.remove();
        dustBurst(s.x, s.y);

        /* رقعة أرض مهيّأة لمن يقف على العشب مباشرة.
           الحقل والعش لهما قاعدتهما (إطار خشبي / عش قش) فلا رقعة لهما. */
        if (item.pad) {
          const pad = document.createElement('span');
          pad.className = 'pad';
          pad.style.cssText =
            `width:${item.w * 0.66}px;height:${item.w * 0.24}px;left:${s.x - item.w * 0.33}px;top:${s.y - item.w * 0.12}px;z-index:${Math.round(s.y) - 2}`;
          world.appendChild(pad);
        }

        const shadow = document.createElement('span');
        shadow.className = 'ground-shadow';
        shadow.style.cssText =
          `width:${item.w * 0.6}px;height:${item.w * 0.14}px;left:${s.x - item.w * 0.3}px;top:${s.y - item.w * 0.06}px;z-index:${Math.round(s.y) - 1}`;
        world.appendChild(shadow);

        const el = document.createElement('button');
        el.className = 'placed grow';
        el.type = 'button';
        el.setAttribute('aria-label', item.name);
        el.style.cssText = `left:${s.x - item.w / 2}px;top:${s.y - item.w * 0.9}px;width:${item.w}px;z-index:${Math.round(s.y)}`;
        el.innerHTML = `<img src="${item.img}" alt="">`;
        el.addEventListener('click', () => say(item.line, 'happy.webp'));
        world.appendChild(el);

        jazour.animate([
          { transform: 'translate(0,0) scale(1)' },
          { transform: 'translate(-9px,-8px) scale(1.08)' },
          { transform: 'translate(0,0) scale(1)' }
        ], { duration: 680, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        say(item.line, 'celebrate.webp');
        notify('اكتمل ' + item.name + ' 🎉');
        objectiveIcon.src = item.img;
      }, 1200);
    }

    function dustBurst(x, y) {
      for (let i = 0; i < 12; i++) {
        const d = document.createElement('i');
        d.className = 'dust';
        d.style.cssText = `left:${x - 7}px;top:${y - 7}px`;
        world.appendChild(d);
        const a = Math.PI * 2 * i / 12, r = 40 + Math.random() * 30;
        d.animate([
          { transform: 'translate(0,0) scale(.5)', opacity: .95 },
          { transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r * .45 - 14}px) scale(1.6)`, opacity: 0 },
        ], { duration: 620, easing: 'ease-out' }).onfinish = () => d.remove();
      }
    }

    /* ═══ الكاميرا ═══ */
    viewport.addEventListener('pointerdown', event => {
      /* يجب أن يصفَّر العدّاد مع كل ضغطة أيًّا كان هدفها.
         لو صُفِّر بعد الخروج المبكر أدناه، بقي كبيرًا بعد أول سحب فرُفضت
         كل ضغطة على علامة ＋ بعده — وهذا ما كان يمنع البناء أصلًا. */
      moved = 0;
      if (event.target.closest('button, .objective, .build-sheet, .top-ui')) return;
      drag = { x: event.clientX, y: event.clientY };
      viewport.classList.add('is-dragging');
      walkTip.classList.add('hide');
    });
    addEventListener('pointermove', event => {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      moved += Math.abs(dx) + Math.abs(dy);
      pan.x = clamp(pan.x + dx, pan.minX, pan.maxX);
      pan.y = clamp(pan.y + dy, pan.minY, pan.maxY);
      drag = { x: event.clientX, y: event.clientY };
      paintWorld();
    });
    function endDrag() { drag = null; viewport.classList.remove('is-dragging'); }
    addEventListener('pointerup', endDrag);
    addEventListener('pointercancel', endDrag);

    /* ═══ الربط ═══ */
    document.getElementById('home').addEventListener('click', () => say('هذا بيتي… تعال نرتب المزرعة سوا!', 'happy.webp'));
    document.getElementById('barn').addEventListener('click', () => say('الحظيرة جاهزة تستقبل الرفيق.', 'encourage.webp'));
    document.getElementById('well').addEventListener('click', () => say('موية البئر تساعد حقلنا يكبر.', 'happy.webp'));
    document.getElementById('field').addEventListener('click', () => say('شوف الجزر! كل إنجاز يساعده ينمو.', 'proud.webp'));
    jazour.addEventListener('click', () => {
      const lines = [
        ['اضغط أي ＋ ونبني شيئًا جديدًا!', 'excited.webp'],
        ['مزرعتنا صارت أجمل بكثير!', 'celebrate.webp'],
        ['كل مهمة تعطينا موارد نبني فيها.', 'proud.webp']
      ];
      const line = lines[Math.floor(Math.random() * lines.length)];
      say(line[0], line[1]);
    });
    focusButton.addEventListener('click', showNextSlot);
    document.getElementById('cancelButton').addEventListener('click', closeBuild);

    drawSlots();
    refreshObjective();
    fitWorld();
    addEventListener('resize', fitWorld);
    addEventListener('orientationchange', fitWorld);

    setTimeout(() => say('هلا يا بطل! اضغط علامة ＋ ونبني سوا.', 'wave.webp'), 650);
  </script>
</body>
</html>
