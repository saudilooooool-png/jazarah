<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>مزرعة جزّور — حقل حي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#3b2b1c; --cream:#fffaf0; --leaf:#4f8f36; --leaf-dark:#31722e; --gold:#efaa49; --shadow:rgba(38,68,25,.28); --ease:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#d9d3c6; }
    body { display:grid; place-items:center; font-family:Cairo,system-ui,sans-serif; color:var(--ink); user-select:none; } button { font:inherit; } button:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    .phone { position:relative; width:min(430px,100vw); height:min(860px,100dvh); overflow:hidden; isolation:isolate; background:#82bd60; border-radius:min(32px,4vw); box-shadow:0 22px 50px rgba(52,41,24,.25); touch-action:none; }
    .world-viewport { position:absolute; inset:0; overflow:hidden; cursor:grab; } .world-viewport.is-dragging { cursor:grabbing; }
    .world { position:absolute; width:1180px; height:664px; top:102px; left:-375px; transform:translate3d(0,0,0); transform-origin:0 0; will-change:transform; }
    .world-base { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
    .ground-shadow { position:absolute; border-radius:50%; background:rgba(34,77,27,.25); filter:blur(5px); pointer-events:none; }
    .home-shadow { width:124px; height:24px; left:531px; top:283px; } .barn-shadow { width:112px; height:22px; left:233px; top:321px; }
    .world-object { position:absolute; border:0; padding:0; background:transparent; transform-origin:50% 100%; cursor:pointer; filter:drop-shadow(0 9px 7px var(--shadow)); }
    .world-object img { width:100%; display:block; pointer-events:none; }.home { z-index:283; width:192px; left:498px; top:110px; animation:breathe 4.6s ease-in-out infinite; }.barn { z-index:321; width:184px; left:197px; top:193px; animation:sway 5.8s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} } @keyframes sway { 0%,100%{transform:rotate(-.7deg)} 50%{transform:rotate(.7deg)} }

    /* الرقعة جزء من الأرض نفسها؛ لا توجد صورة حقل تُوضع فوق صورة حقل */
    .plot-hit { position:absolute; left:229px; top:348px; width:382px; height:236px; border:0; border-radius:46%; background:transparent; z-index:350; pointer-events:none; }
    .crop { position:absolute; z-index:400; width:54px; min-height:56px; border:0; padding:0; background:transparent; cursor:pointer; transform-origin:50% 90%; filter:drop-shadow(0 5px 4px rgba(38,55,20,.26)); transition:filter .18s var(--ease); }
    .crop img { width:100%; height:auto; display:block; pointer-events:none; } .crop:hover { filter:drop-shadow(0 7px 5px rgba(38,55,20,.35)) brightness(1.07); }
    .crop.ready { animation:cropReady 1.75s ease-in-out infinite; }.crop.growing { animation:cropGrow 4.2s ease-in-out infinite; }.crop.seed { opacity:.92; }
    .crop.ready::after { content:''; position:absolute; inset:20% 10% 6%; border-radius:50%; border:2px solid rgba(255,229,104,.8); opacity:0; animation:readyRing 1.75s ease-in-out infinite; pointer-events:none; }
    .crop.empty { width:42px; height:34px; border-radius:50%; background:rgba(40,22,10,.05); cursor:pointer; filter:none; }.crop.empty::before { content:'+'; display:grid; place-items:center; width:25px; height:25px; margin:4px auto; border-radius:50%; color:#74451f; background:rgba(255,247,225,.72); box-shadow:0 2px 0 rgba(81,47,18,.22); font:900 18px/1 Cairo,sans-serif; opacity:.78; transition:opacity .18s; }.crop.empty:hover::before { opacity:1; }
    @keyframes cropReady { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-3px) rotate(1deg)} } @keyframes cropGrow { 0%,100%{transform:rotate(-1deg)} 50%{transform:rotate(1deg)} } @keyframes readyRing { 0%,70%,100%{transform:scale(.75);opacity:0} 82%{transform:scale(1.08);opacity:.9} }
    .crop.pulling { pointer-events:none; animation:none; } .crop.pulling img { animation:pullUp .52s var(--ease) forwards; } @keyframes pullUp { 0%{transform:translateY(0) rotate(0) scale(1);opacity:1} 68%{transform:translateY(-39px) rotate(-9deg) scale(1.13);opacity:1} 100%{transform:translateY(-66px) rotate(10deg) scale(.68);opacity:0} }
    .crop-spark { position:absolute; z-index:999; width:9px; height:9px; border-radius:50%; background:#ffd164; pointer-events:none; box-shadow:0 0 0 2px rgba(255,255,255,.35); }
    .reward-carrot { position:absolute; z-index:1000; width:17px; height:42px; border-radius:52% 52% 62% 62%; background:linear-gradient(90deg,#ef7423,#ffb33e 52%,#df5a1a); box-shadow:inset 3px 1px 0 rgba(255,234,147,.48),0 3px 5px rgba(74,48,19,.24); pointer-events:none; transform-origin:50% 88%; }.reward-carrot::before { content:''; position:absolute; left:2px; right:2px; top:-11px; height:15px; border-radius:65% 25% 60% 25%; background:linear-gradient(90deg,#397e32,#7fc34d); transform:rotate(-10deg); }

    .jazour { position:absolute; border:0; padding:0; background:transparent; left:566px; top:282px; width:94px; z-index:680; cursor:pointer; filter:drop-shadow(0 10px 7px rgba(35,72,25,.3)); transition:left .72s var(--ease),top .72s var(--ease),transform .34s var(--ease); }.jazour.is-harvesting { transform:scale(1.08) rotate(-3deg); }.jazour img { width:100%; display:block; animation:jazourHop 1.1s ease-in-out infinite; }.jazour .character-shadow { position:absolute; width:51px; height:12px; right:21px; bottom:5px; border-radius:50%; background:rgba(36,78,28,.27); filter:blur(3px); z-index:-1; } @keyframes jazourHop { 0%,100%{transform:translateY(0) scaleY(1)}48%{transform:translateY(-5px) scaleY(1.025)}70%{transform:translateY(0) scaleY(.975)} }
    .speech { position:absolute; bottom:83%; right:42%; width:max-content; max-width:min(178px,43vw); padding:8px 11px; background:#fffdf6; border-radius:14px; color:#3c2a18; text-align:center; font:800 12px/1.65 Cairo,sans-serif; box-shadow:0 5px 15px rgba(49,60,33,.22); transform:scale(.6); opacity:0; transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1); pointer-events:none; }.speech::after { content:''; position:absolute; right:22px; top:calc(100% - 1px); border:7px solid transparent; border-top-color:#fffdf6; }.speech.on { transform:scale(1); opacity:1; }

    .top-ui { position:absolute; inset:0 0 auto; z-index:30; padding:11px 11px 34px; pointer-events:none; background:linear-gradient(180deg,rgba(247,252,243,.95),rgba(247,252,243,0)); }.brand { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:14px; background:rgba(255,252,244,.82); color:#5a482c; font:900 11px Cairo,sans-serif; box-shadow:0 3px 9px rgba(39,73,27,.11); }.brand-dot { width:8px; height:8px; background:#74b84d; border-radius:50%; box-shadow:0 0 0 3px rgba(116,184,77,.18); }.resources { display:flex; gap:5px; margin-top:8px; direction:rtl; }.resource { display:flex; flex:1; align-items:center; justify-content:center; gap:3px; min-width:0; padding:5px 3px; border-radius:999px; background:rgba(255,249,235,.96); color:#46351f; box-shadow:0 2px 0 rgba(147,112,67,.16); font:900 12px Cairo,sans-serif; }.resource img { width:17px; height:17px; object-fit:contain; }.resource.bump { animation:resourceBump .48s cubic-bezier(.34,1.56,.64,1); } @keyframes resourceBump { 50%{transform:scale(1.18);background:#fff} }
    .walk-tip { position:absolute; z-index:22; left:50%; top:105px; transform:translateX(-50%); padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.84); color:#65533a; font:800 10.5px Cairo,sans-serif; white-space:nowrap; box-shadow:0 3px 10px rgba(46,73,31,.14); transition:opacity .4s; pointer-events:none; }.walk-tip.hide{opacity:0}
    .objective { position:absolute; right:12px; left:12px; bottom:calc(15px + env(safe-area-inset-bottom)); z-index:35; display:grid; grid-template-columns:42px 1fr auto; align-items:center; gap:9px; padding:9px 10px; background:rgba(255,253,245,.98); border:1px solid rgba(255,255,255,.85); border-radius:19px; box-shadow:0 8px 22px rgba(53,71,34,.23); direction:rtl; }.objective-icon { width:40px; height:40px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(145deg,#ffce6d,#e89543); box-shadow:inset 0 2px 0 rgba(255,255,255,.45); overflow:hidden; }.objective-icon img { width:29px; height:29px; object-fit:contain; }.objective-kicker { color:#6e9b49; font:900 10px Cairo,sans-serif; line-height:1.2; }.objective-title { margin-top:1px; color:#3a2919; font:900 13px Cairo,sans-serif; line-height:1.35; }.objective-copy { display:block; margin-top:1px; color:#806d55; font:700 10px Cairo,sans-serif; }.focus-button { border:0; padding:8px 10px; border-radius:12px; background:var(--leaf); color:#fff; font:900 11px Cairo,sans-serif; box-shadow:0 3px 0 var(--leaf-dark); cursor:pointer; }.focus-button:active { transform:translateY(2px); box-shadow:0 1px 0 var(--leaf-dark); }
    .toast { position:absolute; z-index:900; top:118px; right:50%; width:max-content; max-width:calc(100% - 42px); padding:8px 13px; border-radius:999px; background:rgba(57,99,42,.95); color:#fff; font:800 12px Cairo,sans-serif; transform:translate(50%,-14px) scale(.92); opacity:0; pointer-events:none; transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1); text-align:center; }.toast.show { opacity:1; transform:translate(50%,0) scale(1); }
    .action-sheet { position:absolute; z-index:1000; right:0; bottom:0; left:0; padding:15px 15px calc(20px + env(safe-area-inset-bottom)); background:#fffdf7; border-radius:25px 25px 0 0; box-shadow:0 -10px 28px rgba(41,49,26,.28); transform:translateY(108%); transition:transform .35s cubic-bezier(.34,1.25,.64,1); }.action-sheet.open{transform:translateY(0)}.sheet-handle{width:38px;height:4px;margin:0 auto 11px;border-radius:9px;background:#e7dcc8}.sheet-title{margin:0;color:#342516;font:900 17px Cairo,sans-serif}.sheet-copy{margin:2px 0 0;color:#7c684f;font:700 11px Cairo,sans-serif}.sheet-actions{display:grid;gap:9px;margin-top:13px}.sheet-action{display:flex;align-items:center;gap:10px;width:100%;border:2px solid #ece1cb;border-radius:16px;padding:10px;background:#f9f4e8;text-align:right;color:#3a2919;cursor:pointer}.sheet-action img{width:40px;height:40px;object-fit:contain}.sheet-action b{font:900 12.5px Cairo,sans-serif}.sheet-action small{display:block;margin-top:2px;color:#7d6950;font:800 10.5px Cairo,sans-serif}.cancel-button{width:100%;border:0;border-radius:13px;padding:10px;background:#f3eee4;color:#7b6750;font:800 12px Cairo,sans-serif;cursor:pointer}
    @media(max-height:690px){.phone{border-radius:0}.world{top:65px}.objective{bottom:8px}.walk-tip{top:98px}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="phone" aria-label="مزرعة جزّور">
    <div class="world-viewport" id="viewport" aria-label="عالم المزرعة القابل للتجول"><section class="world" id="world" aria-label="عالم مزرعة جزّور">
      <img class="world-base" src="land/world_farm_single_plot.webp?v=farm-v4" alt="مزرعة ثلاثية الأبعاد فيها رقعة جزر واحدة منظمة">
      <span class="ground-shadow home-shadow"></span><button class="world-object home" id="home" type="button" aria-label="بيت جزّور"><img src="buildings/home_exact.webp?v=3" alt="بيت جزّور"></button>
      <span class="ground-shadow barn-shadow"></span><button class="world-object barn" id="barn" type="button" aria-label="حظيرة الرفيق"><img src="buildings/barn_exact.webp?v=3" alt="حظيرة الرفيق"></button>
      <div class="plot-hit" aria-hidden="true"></div><div id="cropLayer" aria-label="رقعة الجزر"></div>
      <button class="jazour" id="jazour" type="button" aria-label="تحدث مع جزّور"><span class="character-shadow"></span><span class="speech" id="speech" aria-live="polite"></span><img id="jazourImage" src="characters/jazour/hero.webp?v=farm-v4" alt="جزّور"></button>
    </section></div>
    <div class="top-ui"><div class="brand"><span class="brand-dot"></span>مزرعة جزّور</div><div class="resources" aria-label="موارد المزرعة"><div class="resource" data-resource="wood"><span></span><img src="resources/wood.webp" alt="خشب"></div><div class="resource" data-resource="stone"><span></span><img src="resources/stone.webp" alt="حجر"></div><div class="resource" data-resource="water"><span></span><img src="resources/water.webp" alt="ماء"></div><div class="resource" data-resource="light"><span></span><img src="resources/light.webp" alt="نور"></div><div class="resource" data-resource="seed"><span></span><img src="resources/seed.webp" alt="بذور"></div></div></div>
    <p class="walk-tip" id="walkTip">اسحب لتتجول · اضغط جزرة ليحصدها جزّور</p><div class="toast" id="toast" role="status"></div>
    <section class="objective" aria-label="الخطوة التالية"><div class="objective-icon"><img id="objectiveIcon" src="crops/carrot_ready.webp" alt=""></div><div><div class="objective-kicker">خطوتنا التالية</div><div class="objective-title" id="objectiveTitle"></div><span class="objective-copy" id="objectiveCopy"></span></div><button class="focus-button" id="focusButton" type="button">أرِني</button></section>
    <section class="action-sheet" id="sheet" aria-labelledby="sheetTitle" aria-hidden="true"><div class="sheet-handle"></div><h2 class="sheet-title" id="sheetTitle"></h2><p class="sheet-copy" id="sheetCopy"></p><div class="sheet-actions" id="sheetActions"></div><button class="cancel-button" id="cancelButton" type="button">ليس الآن</button></section>
  </main>
<script>
(() => {
  const KEY='jazarah-farm-single-plot-v1', VERSION='farm-v4', GROW_MS=10*60*1000;
  const ASSETS={ seed:'crops/carrot_seedling.webp?v='+VERSION, growing:'crops/carrot_growing.webp?v='+VERSION, ready:'crops/carrot_ready.webp?v='+VERSION, water:'resources/water.webp', seedIcon:'resources/seed.webp', light:'resources/light.webp' };
  const CELLS=[
    {x:375,y:400,s:45},{x:427,y:408,s:47},{x:479,y:416,s:49},{x:531,y:424,s:51},
    {x:339,y:431,s:47},{x:391,y:439,s:49},{x:443,y:447,s:51},{x:495,y:455,s:53},
    {x:303,y:462,s:49},{x:355,y:470,s:51},{x:407,y:478,s:53},{x:459,y:486,s:55},
    {x:328,y:495,s:51},{x:380,y:503,s:53},{x:432,y:511,s:55},{x:484,y:519,s:57}
  ];
  const viewport=document.getElementById('viewport'), world=document.getElementById('world'), cropLayer=document.getElementById('cropLayer'), jazour=document.getElementById('jazour'), jazourImage=document.getElementById('jazourImage'), speech=document.getElementById('speech'), walkTip=document.getElementById('walkTip'), toast=document.getElementById('toast'), sheet=document.getElementById('sheet'), sheetTitle=document.getElementById('sheetTitle'), sheetCopy=document.getElementById('sheetCopy'), sheetActions=document.getElementById('sheetActions'), objectiveIcon=document.getElementById('objectiveIcon'), objectiveTitle=document.getElementById('objectiveTitle'), objectiveCopy=document.getElementById('objectiveCopy'), focusButton=document.getElementById('focusButton');
  const arabic=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]); const clone=o=>JSON.parse(JSON.stringify(o));
  function makeState(){const now=Date.now();return{v:1,resources:{wood:14,stone:10,water:8,light:5,seed:12},crops:CELLS.map(()=>({stage:'ready',wateredAt:now-GROW_MS-1})),jazour:{x:566,y:282},lastVisit:now};}
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&Array.isArray(s.crops)&&s.crops.length===CELLS.length)return s;}catch(e){}return makeState();}
  let state=load(),drag=null,moved=0,worldScale=1,harvesting=false,speechTimer=null,toastTimer=null,audio=null;
  function save(){state.lastVisit=Date.now();localStorage.setItem(KEY,JSON.stringify(state));}
  function grow(){let changed=false;state.crops.forEach(c=>{if(c.stage==='growing'&&Date.now()-c.wateredAt>=GROW_MS){c.stage='ready';changed=true;}});if(changed)notify('كبر الجزر وهو ينتظرك!');}
  function res(){Object.entries(state.resources).forEach(([k,v])=>{const el=document.querySelector(`[data-resource="${k}"] span`);if(el)el.textContent=arabic(v);});}
  function bump(k){const el=document.querySelector(`[data-resource="${k}"]`);if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  function sfx(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime;const notes=kind==='harvest'?[392,587]:kind==='water'?[470,690]:[330,494];notes.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='harvest'?'triangle':'sine';o.frequency.setValueAtTime(hz,t+i*.09);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.075,t+i*.09+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.20);o.connect(g).connect(audio.destination);o.start(t+i*.09);o.stop(t+i*.09+.22);});}catch(e){}}
  function playClip(id){const clip=new Audio(`../audio/prompts/ar/${id}.mp3?v=jazour-v3`);clip.volume=.62;clip.play().catch(()=>{});}
  function say(text,pose='hero.webp'){speech.textContent=text;speech.classList.add('on');jazourImage.src=`characters/jazour/${pose}?v=${VERSION}`;clearTimeout(speechTimer);speechTimer=setTimeout(()=>{speech.classList.remove('on');jazourImage.src=`characters/jazour/hero.webp?v=${VERSION}`;},2500);}
  function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);}
  function stageLabel(stage){return stage==='ready'?'جزرة ناضجة':stage==='growing'?'جزرة تكبر':stage==='seed'?'جزرة صغيرة':'حفرة زراعة فارغة';}
  function renderCrops(){grow();cropLayer.innerHTML=state.crops.map((crop,i)=>{const c=CELLS[i],z=Math.round(c.y)+360;const p=`left:${c.x-c.s/2}px;top:${c.y-c.s*.85}px;width:${c.s}px;z-index:${z};`;if(crop.stage==='empty')return `<button class="crop empty" data-crop="${i}" type="button" aria-label="حفرة زراعة فارغة، اضغط لتزرع جزرة" style="${p}"></button>`;return `<button class="crop ${crop.stage}" data-crop="${i}" type="button" aria-label="${stageLabel(crop.stage)}" style="${p}"><img src="${ASSETS[crop.stage]}" alt="${stageLabel(crop.stage)}"></button>`;}).join('');cropLayer.querySelectorAll('[data-crop]').forEach(el=>el.addEventListener('click',e=>{if(moved>12||harvesting)return;openCrop(Number(el.dataset.crop),el);}));}
  function pending(){return state.crops.filter(c=>c.stage==='seed').length;} function growing(){return state.crops.filter(c=>c.stage==='growing').length;} function ready(){return state.crops.filter(c=>c.stage==='ready').length;} function empty(){return state.crops.filter(c=>c.stage==='empty').length;}
  function refreshObjective(){const r=ready(),s=pending(),g=growing(),e=empty();if(r){objectiveIcon.src=ASSETS.ready;objectiveTitle.textContent=`دع جزّور يحصد ${arabic(r)} جزر${r===1?'ة':'ات'}`;objectiveCopy.textContent='اضغط أي جزرة ناضجة؛ جزّور يمشي إليها ويقطفها بنفسه.';focusButton.dataset.kind='crop';}else if(s){objectiveIcon.src=ASSETS.water;objectiveTitle.textContent='اسقِ البذور من البئر';objectiveCopy.textContent=`لدينا ${arabic(s)} بذور تنتظر قطرة ماء.`;focusButton.dataset.kind='water';}else if(g){objectiveIcon.src=ASSETS.growing;objectiveTitle.textContent='الجزر ينمو في رقعته';objectiveCopy.textContent='ارجع بعد قليل؛ ستجد الجزر ناضجًا بوضوح.';focusButton.dataset.kind='crop';}else if(e&&state.resources.seed){objectiveIcon.src=ASSETS.seedIcon;objectiveTitle.textContent='ازرع جزرة في حفرة فارغة';objectiveCopy.textContent='كل حفرة تمثل جزرة حقيقية مستقلة.';focusButton.dataset.kind='crop';}else{objectiveIcon.src=ASSETS.light;objectiveTitle.textContent='أنجز مهمة لتجلب بذورًا';objectiveCopy.textContent='كل إنجاز حقيقي يساعد مزرعتك تكبر.';focusButton.dataset.kind='home';}}
  function renderAll(){renderCrops();res();refreshObjective();paintJazour();save();}
  function paintJazour(){jazour.style.left=state.jazour.x+'px';jazour.style.top=state.jazour.y+'px';}
  function openSheet(title,copyText,actions){sheetTitle.textContent=title;sheetCopy.textContent=copyText;sheetActions.innerHTML=actions.map(a=>`<button class="sheet-action" type="button" data-action="${a.id}"><img src="${a.img}" alt=""><span><b>${a.label}</b><small>${a.copy}</small></span></button>`).join('');sheetActions.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions.find(a=>a.id===b.dataset.action).run());sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');}
  function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');}
  function openCrop(i,el){const crop=state.crops[i];if(crop.stage==='ready'){harvestOne(i,el);return;}if(crop.stage==='empty'){plantOne(i);return;}if(crop.stage==='seed'){openSheet('هذه البذرة تنتظر الماء','يمكنك سقي كل البذور من البئر أو اقتلاع هذه البذرة فقط.',[{id:'water',label:'اسقِ البذور',copy:'استخدم قطرة ماء واحدة للحقل',img:ASSETS.water,run:waterAll},{id:'uproot',label:'اقتلع هذه البذرة',copy:'أفرغ هذه الحفرة بأمان',img:ASSETS.seedIcon,run:()=>uproot(i)}]);return;}openSheet('هذه الجزرة تكبر','دعها تنمو، أو أفرغ مكانها إذا غيرت خطتك.',[{id:'uproot',label:'اقتلع هذه النبتة',copy:'أفرغ هذه الحفرة بأمان',img:ASSETS.growing,run:()=>uproot(i)}]);}
  function plantOne(i){if(state.resources.seed<1){notify('نحتاج بذرة من مهمة لطيفة');say('أنجز مهمة ونرجع نزرع.', 'thinking.webp');return;}state.resources.seed--;state.crops[i]={stage:'seed',wateredAt:null};sfx('plant');save();renderAll();notify('زرعنا جزرة في مكانها');say('حلو! نرويها من البئر.', 'excited.webp');}
  function waterAll(){const targets=state.crops.filter(c=>c.stage==='seed');if(!targets.length){notify('ما عندنا بذور تحتاج الماء الآن');closeSheet();return;}if(state.resources.water<1){notify('ناقصنا ماء للحقل');return;}state.resources.water--;targets.forEach(c=>{c.stage='growing';c.wateredAt=Date.now();});sfx('water');closeSheet();save();renderAll();notify(`سقينا ${arabic(targets.length)} بذور بقطرة ماء`);say('ارتوت البذور… ننتظرها تكبر.', 'happy.webp');}
  function uproot(i){state.crops[i]={stage:'empty',wateredAt:null};state.resources.seed++;sfx('plant');closeSheet();save();renderAll();notify('أفرغنا هذه الحفرة بترتيب');say('تمام، نقدر نزرع شيًا جديدًا هنا.', 'thinking.webp');}
  function moveJazour(cell,done){const target={x:Math.max(180,cell.x+18),y:cell.y-70};state.jazour=target;paintJazour();setTimeout(done,730);}
  function burst(x,y){for(let i=0;i<10;i++){const p=document.createElement('i');p.className='crop-spark';p.style.left=(x-5)+'px';p.style.top=(y-5)+'px';world.appendChild(p);const a=Math.PI*2*i/10,r=22+Math.random()*21;p.animate([{transform:'translate(0,0) scale(.45)',opacity:.95},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r*.55-15}px) scale(1.35)`,opacity:0}],{duration:540,easing:'ease-out'}).onfinish=()=>p.remove();}}
  function rewardFly(x,y){const item=document.createElement('i');item.className='reward-carrot';item.style.left=(x-8)+'px';item.style.top=(y-38)+'px';world.appendChild(item);const target=document.querySelector('[data-resource="seed"]').getBoundingClientRect(),worldBox=world.getBoundingClientRect();const tx=target.left+target.width/2-worldBox.left-x,ty=target.top+target.height/2-worldBox.top-y;item.animate([{transform:'translate(0,0) rotate(-14deg) scale(.9)',opacity:1},{transform:`translate(${tx*.55}px,${ty*.55-46}px) rotate(18deg) scale(1)`,opacity:1,offset:.55},{transform:`translate(${tx}px,${ty}px) rotate(45deg) scale(.32)`,opacity:.1}],{duration:710,easing:'cubic-bezier(.23,1,.32,1)'}).onfinish=()=>item.remove();}
  function harvestOne(i,el){harvesting=true;const cell=CELLS[i];moveJazour(cell,()=>{jazour.classList.add('is-harvesting');jazourImage.src=`characters/jazour/celebrate.webp?v=${VERSION}`;el.classList.add('pulling');sfx('harvest');burst(cell.x,cell.y);setTimeout(()=>{state.crops[i]={stage:'empty',wateredAt:null};state.resources.seed++;rewardFly(cell.x,cell.y);renderAll();jazour.classList.remove('is-harvesting');harvesting=false;const r=ready();notify(r?`أحسنت! بقي ${arabic(r)} جزر${r===1?'ة':'ات'}`:'يا سلام! حصاد الحقل اكتمل');say(r?'جزرة جميلة! نكمل الحصاد.':'خلصنا الحصاد! مزرعتنا تلمع.',r?'happy.webp':'celebrate.webp');if(!r)playClip('done');},510);});}
  function focus(){let target;if(focusButton.dataset.kind==='water')target={x:920,y:226};else if(focusButton.dataset.kind==='home')target={x:590,y:205};else{const i=state.crops.findIndex(c=>c.stage==='ready'||c.stage==='seed'||c.stage==='empty');target=CELLS[Math.max(0,i)];}const vp=viewport.getBoundingClientRect();pan.x=clamp(vp.width/2-(world.offsetLeft+target.x*worldScale),pan.minX,pan.maxX);pan.y=clamp(vp.height*.44-(world.offsetTop+target.y*worldScale),pan.minY,pan.maxY);paintWorld();say('هنا خطوتنا التالية.', 'thinking.webp');}
  document.getElementById('home').onclick=()=>say('هذا بيتي… والحقل مرتب لجزرنا!', 'happy.webp');document.getElementById('barn').onclick=()=>say('الحظيرة تنتظر الرفيق بعد الحصاد.', 'encourage.webp');jazour.onclick=()=>say('كل جزرة نحصدها سوا، خطوة خطوة!', 'proud.webp');focusButton.onclick=focus;document.getElementById('cancelButton').onclick=closeSheet;
  const pan={x:0,y:0,minX:0,maxX:0,minY:0,maxY:0};function clamp(v,min,max){return Math.max(min,Math.min(max,v));}function paintWorld(){world.style.transform=`translate3d(${pan.x}px,${pan.y}px,0) scale(${worldScale})`}function fitWorld(){const vp=viewport.getBoundingClientRect(),card=document.querySelector('.objective'),band=card?card.getBoundingClientRect().top-vp.top:vp.height,left=world.offsetLeft,top=world.offsetTop,W=world.offsetWidth,H=world.offsetHeight;worldScale=Math.max(1,vp.width/W,(band-top)/H);const w=W*worldScale,h=H*worldScale;pan.maxX=-left;pan.minX=vp.width-(left+w);pan.maxY=0;pan.minY=band-(top+h);if(pan.minX>pan.maxX)pan.minX=pan.maxX=(vp.width-w)/2-left;if(pan.minY>pan.maxY)pan.minY=pan.maxY=0;pan.x=clamp(pan.x,pan.minX,pan.maxX);pan.y=clamp(pan.y,pan.minY,pan.maxY);paintWorld()}
  viewport.addEventListener('pointerdown',e=>{moved=0;if(e.target.closest('button,.objective,.action-sheet,.top-ui'))return;drag={x:e.clientX,y:e.clientY};viewport.classList.add('is-dragging');walkTip.classList.add('hide')});addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);pan.x=clamp(pan.x+dx,pan.minX,pan.maxX);pan.y=clamp(pan.y+dy,pan.minY,pan.maxY);drag={x:e.clientX,y:e.clientY};paintWorld()});function endDrag(){drag=null;viewport.classList.remove('is-dragging')}addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);addEventListener('resize',fitWorld);addEventListener('orientationchange',fitWorld);
  grow();renderAll();fitWorld();setTimeout(()=>say('هلا يا بطل! اختر جزرة، وأنا أحصدها معك.', 'wave.webp'),620);
})();
</script>
