# نشر التطبيق على GitHub Pages — رابط دائم يفتحه أي جهاز
# (مسار الآيفون: يفتح الوالد الرابط في Safari ثم "إضافة إلى الصفحة الرئيسية")

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, claude/family-adventure-game-app-17qvyc]
    paths-ignore: ['README.md', '.github/workflows/build-apk.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js audio.js voice.js farm.js sync.js qrcode.js quran.js manifest.webmanifest sw.js _site/
          cp -r icons avatars audio _site/
          # المزرعة: الرسومات المضغوطة ومعاينتها فقط — لا نرفع الأصول الثقيلة
          mkdir -p _site/farm
          rsync -a --include='*/' --include='*.webp' --include='preview.html' \
                --exclude='*' farm/ _site/farm/
          sed -i "s/BUILD_PLACEHOLDER/web-${{ github.run_number }}/" _site/app.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
